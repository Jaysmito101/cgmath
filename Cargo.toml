[package]

name = "cgmath"
version = "0.18.0"
authors = ["Rust game-developers"]
license = "Apache-2.0"
description = "A linear algebra and mathematics library for computer graphics."

documentation = "https://docs.rs/cgmath"
homepage = "https://github.com/rustgd/cgmath"
repository = "https://github.com/rustgd/cgmath"
readme = "README.md"
autobenches = true

keywords = ["gamedev", "math", "matrix", "vector", "quaternion"]

[lib]
name = "cgmath"

[features]
simd = ["dep:try-specialize", "dep:wide"]
unstable = []
swizzle = []

[dependencies]
approx = "0.5"
mint = { version = "0.5.8", optional = true }
num-traits = "0.2"
# small_rng used only for benchmarks
rand = { version = "0.8", features = ["small_rng"], optional = true }
serde = { version = "1.0", features = ["serde_derive"], optional = true }
bytemuck = { version = "1.0", optional = true }
try-specialize = { version = "0.1.2", default-features = false, optional = true }
wide = { version = "1.7.1", optional = true }

[dev-dependencies]
serde_json = "1.0"

[[bench]]
name = "simd"
harness = false
